function usageRanks(r){if(!r)return '—';const lines=(r.rows||[]).map(x=>'#'+x.rank+' '+esc(namedText(x))+' · <b>'+x.jobs.toLocaleString()+'</b> '+esc(labels.countJobs));if(r.unassigned_jobs)lines.push(esc(labels.unassigned)+' · '+r.unassigned_jobs.toLocaleString()+' '+esc(labels.countJobs));return lines.join('<br>')||esc(labels.noNamedAccounts);}

function renderUsage(c,fresh){const el=byId('cluster-usage'),u=c?.usage;el.hidden=!u;if(!u)return;const h=u.historical||{},cfg=u.accounting_config||{};let html='<p class="cluster-note">'+esc(labels.rankingScope)+'<br>'+esc(labels.retainedPeriod)+': '+esc((h.first_retained_start||'?').slice(0,10))+' → '+esc((h.last_retained_start||'?').slice(0,10))+' KST</p>';
if(u.disclosure==='local_review')html+='<p class="warning-message">'+esc(labels.localReview)+'</p>';
if(h.status!=='ok')html+='<p class="warning-message">'+esc(labels.usageUnavailable)+'</p>';
else if(!['approved','local_review'].includes(u.disclosure))html+='<p class="cluster-note">'+esc(labels.approvalPending)+'</p>';
else html+='<div class="rankings"><section><h2>'+esc(labels.allTop5)+'</h2>'+rankingTable(h.top5)+'</section><section><h2>'+esc(labels.lastMonthTop3)+' · '+esc(h.last_month?.month||'?')+'</h2>'+rankingTable(h.last_month?.ranking)+'</section></div>';

if(h.status==='ok'){html+='<p class="cluster-note">'+esc(labels.audit)+' · '+(h.audit?.logical_started_jobs??'?').toLocaleString()+' '+esc(labels.countJobs)+' · '+esc(labels.requeuesRemoved)+' '+(h.audit?.requeue_records_collapsed??0)+' · '+esc(labels.noStartRemoved)+' '+(h.audit?.no_actual_start??0).toLocaleString()+'</p>';if(h.lineage_inferred)html+='<p class="cluster-note">'+esc(labels.lineageBounds)+': '+h.count_lower_bound.toLocaleString()+'–'+h.count_upper_bound.toLocaleString()+'</p>';}
html+='<p class="cluster-note">'+esc(labels.purgeCaveat)+'</p></details>';el.innerHTML=html;}
function performanceNumber(value){return typeof value==='number'&&Number.isFinite(value)?value.toFixed(1):'?';}
function nodeCpuReference(name){const g=data.nominal_fp32?.sg?.node_groups?.find(group=>group.nodes.includes(name));if(!g)return '';return '<span>CPU: '+esc(g.cpu_model)+' · '+performanceNumber(g.base_GHz)+' GHz</span><span>'+esc(labels.fp32)+' '+performanceNumber(g.fp32_TFLOPS)+' · '+esc(labels.fp64)+' '+performanceNumber(g.fp64_TFLOPS)+' TFLOPS</span>';}
function nodeDetails(name){const n=nodeMap.get(name);if(!n)return;selected.set(activeHost,name);document.querySelectorAll('.node').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.node===name)));byId('selection').innerHTML='<div><div class="selected-title">'+esc(n.name)+' · '+esc(stateText(n.state))+'</div><div class="selected-subtitle">'+esc(n.partitions.join(' · '))+'</div></div><div class="node-detail">'+nodeCpuReference(name)+'<span>'+esc(labels.allocatedCpu)+': '+fraction(n.slurm_cpus_allocated,n.slurm_cpus_total)+'</span><span>'+esc(labels.topology)+': '+fraction(n.sockets,'?').split(' / ')[0]+' × '+(n.cores_per_socket??'?')+' '+esc(labels.physical)+' · '+(n.threads_per_core??'?')+' '+esc(labels.threadsPerCore)+'</span><span>'+esc(labels.allocatedRam)+': '+capacity(n.memory_allocated_bytes)+' / '+capacity(n.memory_total_bytes)+'</span><span>'+esc(labels.osFree)+': '+capacity(n.slurm_free_memory_bytes)+' · '+esc(labels.notAvailable)+'</span><span>'+esc(labels.allocatedGpu)+': '+fraction(n.allocated_gpus,n.configured_gpus)+' · '+esc(labels.vram)+': ?</span><span>'+esc(labels.jobLabels)+': '+esc(n.job_labels.length?n.job_labels.map(j=>namedText(j)+' #'+(j.id_missing?labels.unknownValue:j.id)).join(' · '):(cQueryFresh()?labels.noAssignedJobs:labels.unknown))+'</span></div>';}
function renderJobCounter(c,fresh){const el=byId('job-counter'),j=c?.job_counter;el.hidden=!j;if(!j)return;const id=fresh&&freshRow({status:j.status,local_completed_at_utc:j.checked_at_utc})&&Number.isSafeInteger(j.latest_job_id)?j.latest_job_id.toLocaleString():'?';el.innerHTML='<p class="metric-label">'+esc(labels.jobCounter)+'</p><p class="value">'+id+'</p><p class="cluster-note">'+esc(labels.jobCounterNote)+'<br>'+esc(labels.jobIdLimit)+': '+(j.MaxJobId?.toLocaleString()??'?')+' · '+esc(j.checked_at_utc?time(j.checked_at_utc):'?')+' KST'+'</p>';}
function renderCluster(s,c,fresh){renderJobCounter(c,fresh);renderUsage(c,fresh);renderMasterStorage(s.latest);byId('sockets').className='node-grid';byId('sampling-note').textContent=labels.masterScope+' '+labels.clusterNote;byId('legend').textContent=labels.allocationNote;

byId('gpu-heading').textContent=labels.allocatedGpu;byId('gpu-heading').title=labels.gpuClusterNote;byId('gpu-count').textContent=fraction(fresh?c.allocated_gpus:null,c.configured_gpus);byId('gpu-count').title=labels.gpuClusterNote;
const gpuNodes=c.nodes.filter(n=>n.configured_gpus>0);byId('gpus').innerHTML=gpuNodes.length?gpuNodes.map(n=>'<article class="gpu"><div class="gpu-head"><span class="gpu-name">'+esc(n.name)+' · '+(n.configured_gpus??'?')+' GPU</span><span class="gpu-state">'+esc(labels.notSampled)+'</span></div><div class="gpu-bottom"><span class="muted">'+esc(labels.vram)+'</span><b>? GB</b></div><p class="gpu-detail">'+esc(labels.gpuClusterNote)+'</p></article>').join(''):'<p class="gpu-failed muted">'+esc(labels.notSampled)+'</p>';
byId('core-heading').textContent=labels.computeNodes+' · '+c.node_count;nodeMap=new Map(c.nodes.map(n=>[n.name,n]));byId('sockets').innerHTML=c.nodes.map(n=>'<button class="node '+(n.slurm_cpus_allocated>0?'busy':'')+'" data-node="'+esc(n.name)+'" aria-pressed="false"><span class="node-top"><span class="node-name">'+esc(n.name)+'</span><span class="node-state">'+esc(stateText(n.state))+'</span></span><div class="node-count">'+fraction(fresh?n.slurm_cpus_allocated:null,n.slurm_cpus_total)+'</div><div class="node-jobs" title="'+esc(n.job_labels.map(j=>namedText(j)).join(' · '))+'">'+esc(n.job_labels.length?n.job_labels.map(j=>namedText(j)).join(' · '):(cQueryFresh()?labels.noAssignedJobs:labels.unknown))+'</div></button>').join('');
nodeDetails(nodeMap.has(selected.get(activeHost))?selected.get(activeHost):c.nodes.find(n=>n.slurm_cpus_allocated>0)?.name||c.nodes[0]?.name);
const queueFresh=fresh&&c.query_ok?.queue;byId('metrics').insertAdjacentHTML('beforeend','<p class="total" style="grid-column:1/-1">'+esc(labels.runningJobs)+' <b>'+(queueFresh?(c.job_states?.RUNNING??0):'?')+'</b> · '+esc(labels.pendingJobs)+' <b>'+(queueFresh?(c.job_states?.PENDING??0):'?')+'</b> · '+esc(labels.masterScope)+'</p>');
const jobs=byId('cluster-jobs');jobs.hidden=false;if(!queueFresh){jobs.innerHTML='<p class="warning-message">'+esc(labels.queueFailed)+'</p>';return;}jobs.innerHTML='<details class="job-details"><summary>'+esc(labels.visibleJobs)+' '+(c.visible_job_count??'?')+' · '+Object.entries(c.job_states||{}).map(([st,n])=>esc(stateText(st))+' '+n).join(' · ')+'</summary><p class="cluster-note">'+esc(labels.jobLabelsNote)+(c.jobs_truncated?' '+esc(labels.jobsLimit):'')+'</p><table><thead><tr><th>'+esc(labels.jobLabels)+'</th><th>'+esc(labels.state)+'</th><th>'+esc(labels.allocatedCpu)+'</th><th>'+esc(labels.nodes)+'</th></tr></thead><tbody>'+c.jobs.map(j=>'<tr><td>'+esc(namedText(j))+'<span class="volume-device">#'+esc(j.id_missing?labels.unknownValue:j.id)+'</span></td><td>'+esc(stateText(j.state))+'</td><td>'+(j.slurm_cpus??'?')+'</td><td>'+esc(j.nodes.length?j.nodes.join(', '):'—')+'</td></tr>').join('')+'</tbody></table></details>';}

function renderPerformance(){const p=data.nominal_fp32?.[activeHost], d=data.nominal_fp64?.[activeHost];const el=byId('performance');el.hidden=!p;if(!p)return;el.innerHTML='<summary>'+esc(labels.fp32)+' · CPU <b>'+performanceNumber(p.cpu_TFLOPS)+'</b> · GPU <b>'+performanceNumber(p.gpu_TFLOPS)+'</b> TFLOPS</summary>'+(d?'<p>'+esc(labels.fp64)+' · CPU <b>'+performanceNumber(d.cpu_TFLOPS)+'</b> · GPU <b>'+performanceNumber(d.gpu_TFLOPS)+'</b> TFLOPS</p>':'')+'<p>'+esc(labels.precisionNote)+'</p><p>'+esc(labels.precisionFormula)+'</p>'; }

function renderResourceScope(){
 const el=byId('resource-scope');if(!el)return;
 const scope=current().s.latest.resource_scope;
 el.hidden=!scope?.shared_host;
 el.textContent=scope?.shared_host?labels.sharedHostScope.replace('{count}',scope.lab_usable_gpu_count):'';
}
function namedText(item,fallback=labels.unknownValue){return item.name_missing?fallback:item.name;}
function threadPrograms(thread){return (thread.programs||[]).map((name,i)=>thread.program_names_missing?.[i]?labels.noName:name);}
function renderMasterStorage(row){
 const el=byId('storage'),st=row?.storage;el.hidden=false;
 let html='<div class="storage-head"><h2>'+esc(labels.masterStorage)+'</h2></div><p class="master-storage-meta">'+esc(labels.masterStorageScope)+'</p>';
 const stamp=instant(st?.checked_at_utc),validStamp=Number.isFinite(stamp),age=(Date.now()-stamp)/60000;
 const fresh=validStamp&&age>=-5&&age<=data.stale_after_minutes;
 html+='<p class="master-storage-meta">'+esc(labels.storageObserved)+': '+esc(time(st?.checked_at_utc))+(validStamp?' KST':'')+'</p>';
 if(!st||!['ok','partial'].includes(st.status)||st.scope!=='sg_master_mounts'){
  el.innerHTML=html+'<p class="storage-status warning-message">'+esc(labels.storageQueryFailed)+'</p>';return;
 }
 if(!fresh){el.innerHTML=html+'<p class="storage-status warning-message">'+esc(validStamp&&age>=-5?labels.storageStale:labels.storageTimeUnknown)+'</p>';return;}
 if(st.low_space_filesystems)html+='<p class="space-warning" title="'+esc(labels.storageWarning)+'">'+esc(labels.lowSpace)+' · '+st.low_space_filesystems+'</p>';
 const rows=st.volumes||[];
 for(const [scope,title] of [['shared',labels.sharedStorage],['master_local',labels.localStorage],['unclassified',labels.otherStorage]]){
  const volumes=rows.filter(v=>(['shared','master_local'].includes(v.scope)?v.scope:'unclassified')===scope);
  if(!volumes.length)continue;
  html+='<table class="master-storage-table"><caption>'+esc(title)+'</caption><thead><tr><th scope="col">'+esc(labels.mount)+'</th><th scope="col">'+esc(labels.total)+'</th><th scope="col">'+esc(labels.used)+'</th><th scope="col">'+esc(labels.available)+'</th><th scope="col" title="'+esc(labels.usagePercentNote)+'">'+esc(labels.usagePercent)+'</th></tr></thead><tbody>';
  html+=volumes.map(v=>{
   const observed=v.status==='mounted',warning=observed&&['low','full'].includes(v.space_status);
   const device=v.device==='Local filesystem'?labels.localFilesystem:volumeText(v.device);
   const mounts=v.mounts?.length?v.mounts:[device||labels.unknownValue];
   const percent=observed&&Number.isFinite(v.use_percent)&&v.use_percent>=0&&v.use_percent<=100?v.use_percent+'%':'?';
   return '<tr class="'+(warning?'low':'')+'"><td>'+mounts.map(m=>'<span class="mount-alias">'+esc(m)+'</span>').join('')+'<span class="volume-device">'+esc([v.fstype,device,v.mount_access==='read_only'?labels.readOnly:null,!observed?labels.usage_unknown:null].filter(Boolean).join(' · '))+'</span></td><td>'+capacity(observed?v.total_bytes:null)+'</td><td>'+capacity(observed?v.used_bytes:null)+'</td><td>'+capacity(observed?v.available_bytes:null)+(warning?'<span class="volume-device space-warning">'+esc(v.space_status==='full'?labels.fullSpace:labels.lowSpace)+'</span>':'')+'</td><td>'+percent+'</td></tr>';
  }).join('')+'</tbody></table>';
 }
 if(!rows.length||st.status==='partial')html+='<p class="storage-status">'+esc(labels.storagePartial)+'</p>';
 html+='<p class="master-storage-meta">'+esc(labels.storageAliasesNote)+'</p><p class="master-storage-meta">'+esc(labels.usagePercentNote)+'</p>';
 el.innerHTML=html;
}
function stateText(value){if(language==='en'||!value)return value;const names=stateNames[language];return String(value).split('+').map(part=>{const match=part.match(/^([A-Z_]+)(.*)$/);return match&&names[match[1]]?names[match[1]]+' ('+part+')':labels.unknownValue+' ('+part+')';}).join(' + ');}
function volumeText(value){return value==='Network volume'?labels.networkVolume:value==='Unknown'?labels.unknownValue:value;}
function retentionText(value){if(!value)return '?';if(language==='en')return value;return String(value).replace(/\b(seconds?|minutes?|hours?|days?|weeks?|months?|years?)\b/gi,unit=>retentionUnits[language][unit.toLowerCase().replace(/s$/,'')]);}
function repaint(){
 const opened=[...document.querySelectorAll('details')].map((el,i)=>el.open?i:-1).filter(i=>i>=0);
 byId('title').textContent=labels.title;
 byId('tabs').setAttribute('aria-label',labels.host);
 byId('units-note').textContent=labels.bytesNote;
 byId('sampling-note').textContent=labels.sampleNote;
 byId('legend').innerHTML='<span><i class="swatch"></i>'+esc(labels.idle)+'</span><span><i class="swatch busy"></i>'+esc(labels.active)+'</span>';
 render();
 document.querySelectorAll('details').forEach((el,i)=>{el.open=opened.includes(i);});
}
function setLanguage(value){
 if(!['en','ko','zh','ur','fa'].includes(value))return;
 language=value;labels=dictionaries[value];document.documentElement.lang=value==='zh'?'zh-Hans':value;document.documentElement.dir=['fa','ur'].includes(value)?'rtl':'ltr';repaint();
}
if(typeof window!=='undefined'){
 window.addEventListener('message',event=>{
  if(event.source!==window.parent||event.data?.type!=='mtap-server-status:language')return;
  setLanguage(event.data.language);
 });
 window.parent.postMessage({type:'mtap-server-status:ready'},'*');
}
repaint();setInterval(repaint,60000);

(()=>{const send=()=>parent.postMessage({type:'mtap-server-status:size',height:Math.ceil(document.documentElement.scrollHeight)},'*');
new ResizeObserver(send).observe(document.body);addEventListener('load',send);send();})();
