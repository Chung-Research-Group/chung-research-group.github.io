name: Monitor publications and process Slack approvals

on:
  schedule:
    - cron: '17 0 * * *' # 09:17 KST (UTC+9)
  workflow_dispatch:

permissions:
  contents: read
  models: read

concurrency:
  group: publication-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Monitor Crossref and Slack
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLICATION_GITHUB_TOKEN }}
          PUBLICATION_ORCID: '0000-0002-7756-0589'
          SLACK_CHANNEL_ID: 'C0BJ2607NGL'
          SLACK_BOT_TOKEN: ${{ secrets.PUBLICATION_SLACK_BOT_TOKEN }}
          PUBLICATION_APPROVER_USER_IDS: ${{ vars.PUBLICATION_APPROVER_USER_IDS }}
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
          GITHUB_MODELS_TOKEN: ${{ github.token }}
          PUBLICATION_LLM_API_KEY: ${{ secrets.PUBLICATION_LLM_API_KEY }}
          PUBLICATION_LLM_PROVIDER: ${{ vars.PUBLICATION_LLM_PROVIDER || 'github' }}
          PUBLICATION_LLM_MODEL: ${{ vars.PUBLICATION_LLM_MODEL }}
        run: node scripts/publication-bot.mjs
