name: Refresh publication metadata

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - feed.js

permissions:
  contents: read

concurrency:
  group: publication-metadata
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SCHOLAR_AUTHOR_ID: 'q-UUrywAAAAJ'
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.PUBLICATION_GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm ci

      - name: Refresh publication and per-paper citation metadata
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: node scripts/refresh-publication-metadata.mjs

      - name: Test metadata refresh logic
        run: node --test tests/publication-metadata.test.mjs

      - name: Validate metadata schema
        run: node scripts/refresh-publication-metadata.mjs --check

      - name: Validate production site
        run: npm run check

      - name: Publish changed metadata
        shell: bash
        run: |
          if git diff --quiet -- data/publication-metadata.json; then
            echo "Publication metadata is unchanged."
            exit 0
          fi
          git config user.name "Publication Metadata Bot"
          git config user.email "publication-bot@users.noreply.github.com"
          git add data/publication-metadata.json
          git commit -m "Update publication research metadata"
          git push origin HEAD:main
